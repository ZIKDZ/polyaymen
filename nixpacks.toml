[phases.setup]
# nodejs_20 in nixpkgs is 20.18.x — BELOW the ^20.19.0 || >=22.12.0 that
# Vite 7+/rolldown require. Must be 22.
nixPkgs = ["python312", "nodejs_22"]

[phases.install]
commands = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  # npm ci can fail to pull the correct platform-specific optional binary
  # for rolldown (npm/cli#4828). Deleting node_modules + the lockfile and
  # doing a fresh npm install forces npm to re-resolve optional deps
  # against Railway's actual container platform (linux-x64-gnu).
  "cd frontend && rm -rf node_modules package-lock.json && npm install --include=optional --no-audit --no-fund"
]

[phases.build]
commands = [
  "cd frontend && npm run build",
  ". /opt/venv/bin/activate && python manage.py collectstatic --noinput --clear"
]

[start]
cmd = "/opt/venv/bin/python manage.py migrate --noinput && /opt/venv/bin/gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT --access-logfile -"
